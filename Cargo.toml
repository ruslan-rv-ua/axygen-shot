[package]
name = "axygen-shot"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "shot"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
png = "0.17"
thiserror = "2"
chrono = { version = "0.4", features = ["clock"], default-features = false }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Media_Audio",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_Xps",
    "Win32_System_Ole",
    "Win32_System_Console",
]

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
